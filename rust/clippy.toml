absolute-paths-max-segments = 2
absolute-paths-allowed-crates = ["std", "core", "alloc"]

allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-dbg-in-tests = true

too-many-arguments-threshold = 6
# Raised from 60 so `examples/tprf_runner.rs` can keep `generate` in one piece. Splitting
# it was a lint artifact, not a readability win: the Scala it ports is one method, and the
# split invited the wrong conclusion about what the fallible `intoMut` was costing.
too-many-lines-threshold = 100
cognitive-complexity-threshold = 15
