[package]
# "uni" is squatted on crates.io (abandoned 2018 WIP); the lib name below keeps
# `use uni::…` working for client code regardless of the package name.
name = "vastblue-uni"
# Lockstep with the Scala library's version in build.sbt: both publish together
# from release-and-publish.sh, which asserts the two agree. The number says
# which uni release this port mirrors; PARITY.md says how much of it.
version = "0.22.0"
edition = "2024"
rust-version = "1.87"
description = "Rust port of the uni Scala library: NumPy/pandas-style matrices and linear algebra (MatD) pinned bit-for-bit to the JVM, big-data CSV tooling, MSYS2/Cygwin-aware path resolution, date-time parsing and arithmetic, BigDecimal-compatible decimals, and 3PRF forecasting"
license = "Apache-2.0"
repository = "https://github.com/philwalk/uni"
readme = "README.md"
# crates.io search leans on these three fields; the name "uni" is unsearchable on its own.
# Budget: 5 keywords (<=20 chars), 5 categories from crates.io's fixed slug list. The
# keywords carry the numerics search terms; the path/date/decimal terms ride on the description.
keywords = ["linear-algebra", "numpy", "pandas", "scala", "big-data"]
categories = ["filesystem", "date-and-time", "mathematics", "parser-implementations", "science"]
# The tests and bench bins read ../test-data, which lives outside the package root and
# cannot ship in the crate -- exclude them so the tarball carries no tests that cannot run.
# The examples DO ship: they are the cross-language demo pairs the README documents, they
# are self-contained (no fixtures), and market_sim is consumed as a product --
# `cargo install vastblue-uni --example market_sim` builds the simulator from the crate.
# rust-toolchain.toml is excluded so the repo's pinned toolchain is not forced onto consumers.
exclude = ["tests/", "src/bin/", "doc-examples/", "docs/", "Makefile", "rustfmt.toml", "rust-toolchain.toml"]

[lib]
name = "uni"
crate-type = ["rlib"]

# The other examples are auto-discovered; this one is declared so `test = true` makes
# `cargo test` RUN its `#[cfg(test)]` sidecar-contract tests. Without it cargo only
# compiles the example, and the contract guards would pass by never executing.
[[example]]
name = "market_sim"
test = true

[lints.rust]
unreachable_pub = "warn"
unused_qualifications = "warn"
dead_code = "warn"
unused_variables = "warn"

[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
absolute_paths = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
wildcard_imports = "warn"
enum_glob_use = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
await_holding_lock = "warn"
rc_mutex = "warn"
mem_forget = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
map_err_ignore = "warn"
let_underscore_must_use = "warn"

[features]
default = []
# Route ndarray's matmul through a system OpenBLAS instead of the pure-Rust
# `matrixmultiply` kernels. Worth ~3x on the OOS paths, whose gemms are skinny
# (one operand has only L+1 columns) — a shape matrixmultiply handles poorly.
#
# Opt-in: needs OpenBLAS installed and on the linker path
#   MSYS2:  pacman -S mingw-w64-ucrt-x86_64-openblas
#   build:  OPENBLAS_LIB_DIR=/ucrt64/lib cargo build --release --features blas
#
# Set OPENBLAS_NUM_THREADS=1 when running: the OOS loops are already parallel
# over windows via rayon, so letting OpenBLAS spawn its own threads nests
# fork/join inside fork/join and costs ~10%.
blas = ["ndarray/blas", "dep:blas-src", "dep:openblas-src"]

[dependencies]
ndarray = "0.17.2"
rayon = "1.10"
thiserror = "2"
blas-src = { version = "0.11", optional = true, features = ["openblas"] }
openblas-src = { version = "0.10", optional = true, features = ["system"] }

[dev-dependencies]
tempfile = "3"

# Optimize this crate in dev too, not just its dependencies: `package."*"` alone
# leaves t3prf itself unoptimized, which made `cargo run --bin bench_tprf3`
# report numbers ~10-25x slower than the code actually runs.
[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
