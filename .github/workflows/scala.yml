name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4

    # Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install NumPy 2.x
      run: |
        python3 -m pip install --upgrade pip
        python3 -m pip install "numpy>=2.0.0"

    # Setup Java with sbt caching
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: sbt

    # Setup sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    # Run tests
    - name: Run tests
      run: sbt test

  # The example code in README.md and docs/*.md must compile AND run: every ```scala
  # block is a shebang-led script, extracted, compiled with -Wunused:imports -Werror and
  # run by checkDocScripts.sh (the same gate release-and-publish.sh runs, step 6c). publishLocal first, so the
  # blocks' `//> using dep org.vastblue:uni_3:<version>` resolves for an unreleased
  # version too — a stale example fails here on the commit that broke it, not at release.
  doc-scripts:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: sbt
    - name: Set up sbt
      uses: sbt/setup-sbt@v1
    - name: Set up scala-cli
      uses: VirtusLab/scala-cli-setup@main
    - name: Publish the library locally
      run: sbt publishLocal
    - name: Compile and run every doc script
      run: bash checkDocScripts.sh
